[package]
name = "fuzzyland"
version = "0.1.0"
edition = "2021"
description = "Fast, theme-agnostic Rust shell daemon and CLI for Hyprland, Waybar, and Fuzzel"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
libpulse-binding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "process", "signal", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
